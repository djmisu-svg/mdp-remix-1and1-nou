<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MdP RemiX 1&1</title><style>body{margin:0;background:#101217;color:#f5f5f5;font:16px system-ui;padding:24px}h1{color:#e8c47a}button,input{font:inherit;border-radius:10px;padding:12px;margin:5px 0}button{background:#d3ad61;color:#161616;border:0}input{box-sizing:border-box;width:100%;background:#252934;border:1px solid #555;color:white}article{background:#20232b;border-radius:14px;padding:14px;margin:12px 0}small{color:#bbb}.row{display:flex;gap:8px;flex-wrap:wrap}a{color:#e8c47a}</style></head><body><h1>MdP RemiX 1&1</h1><p>Biblioteca mea muzicală</p><input id="title" placeholder="Titlul melodiei"><input id="url" placeholder="Link YouTube sau melodie"><button onclick="add()">Adaugă melodie</button><div class="row"><button onclick="render('all')">Toate</button><button onclick="render('fav')">Favorite</button><button onclick="exportData()">Export</button><button onclick="document.getElementById('import').click()">Import</button></div><input id="import" type="file" accept="application/json" style="display:none" onchange="importData(event)"><div id="songs"></div><script>let tracks=JSON.parse(localStorage.getItem('tracks')||'[]');let mode='all';function save(){localStorage.setItem('tracks',JSON.stringify(tracks))}function add(){let t=document.getElementById('title').value.trim(),u=document.getElementById('url').value.trim();if(!t||!/^https?:\/\//i.test(u)){alert('Completează titlul și un link http(s) valid.');return}tracks.push({id:Date.now()+Math.random(),title:t,url:u,fav:false});save();document.getElementById('title').value='';document.getElementById('url').value='';render(mode)}function toggle(id){let x=tracks.find(x=>x.id===id);if(x)x.fav=!x.fav;save();render(mode)}function del(id){tracks=tracks.filter(x=>x.id!==id);save();render(mode)}function render(m){mode=m;let el=document.getElementById('songs');el.replaceChildren();let list=tracks.filter(x=>m!=='fav'||x.fav);if(!list.length){el.textContent='Nu ai melodii în această listă.';return}for(let x of list){let a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),link=document.createElement('a'),fav=document.createElement('button'),remove=document.createElement('button');h.textContent=x.title;link.textContent='Deschide melodia';link.href=x.url;link.target='_blank';fav.textContent=x.fav?'★ Favorit':'☆ Favorit';fav.onclick=()=>toggle(x.id);remove.textContent='Șterge';remove.onclick=()=>del(x.id);p.append(link);a.append(h,p,fav,remove);el.append(a)}}function exportData(){let blob=new Blob([JSON.stringify(tracks,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mdp-melodii.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data)||!data.every(x=>typeof x.title==='string'&&typeof x.url==='string'))throw Error();tracks=data.map(x=>({id:Date.now()+Math.random(),title:x.title,url:x.url,fav:!!x.fav}));save();render(mode)}catch{alert('Fișier JSON invalid')}};r.readAsText(f)}render('all');</script></body></html>

name: Build Android APK (compatibility)

# Keep the previous workflow path available without its obsolete SDK defaults.
# New pushes and pull requests are handled by build.yml.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose isolated test, signed release, or an existing-key audit (no build)'
        type: choice
        options: [premium-test, release, signing-audit]
        default: premium-test
      version_name:
        description: 'Production version (major.minor.patch); blank uses the source default'
        type: string
        default: ''
      publish_release:
        description: 'Publish the verified production APK publicly'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.target == 'premium-test' }}
    uses: ./.github/workflows/build.yml

  release:
    if: ${{ inputs.target == 'release' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version_name: ${{ inputs.version_name }}
      publish_release: ${{ inputs.publish_release }}
    secrets: inherit

  signing_audit:
    if: ${{ inputs.target == 'signing-audit' }}
    permissions:
      contents: read
    uses: ./.github/workflows/signing-audit.yml
    secrets: inherit

name: Build Android APK (compatibility)

# Keep the previous workflow path available without its obsolete SDK defaults.
# New pushes and pull requests are handled by build.yml.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose test, signed verification build, exact-artifact publication, or key audit'
        type: choice
        options: [premium-test, release, publish-release, signing-audit]
        default: premium-test
      version_name:
        description: 'Production version (major.minor.patch); blank uses the source default'
        type: string
        default: ''
      publish_release:
        description: 'Legacy option: keep false; use publish-release after testing the signed artifact'
        type: boolean
        default: false
      source_run_id:
        description: 'Successful signed verification run containing the exact APK tested on devices'
        type: string
        default: ''
      private_backup_confirmed:
        description: 'Signing key/password and personal data have verified private backups'
        type: boolean
        default: false
      physical_sharing_verified:
        description: 'This exact signed APK passed WhatsApp sharing and installation on another Android device'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.target == 'premium-test' }}
    uses: ./.github/workflows/build.yml

  release:
    if: ${{ inputs.target == 'release' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version_name: ${{ inputs.version_name }}
      publish_release: ${{ inputs.publish_release }}
    secrets: inherit

  signing_audit:
    if: ${{ inputs.target == 'signing-audit' }}
    permissions:
      contents: read
    uses: ./.github/workflows/signing-audit.yml
    secrets: inherit

  publish_release:
    if: ${{ inputs.target == 'publish-release' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-verified-release.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      private_backup_confirmed: ${{ inputs.private_backup_confirmed }}
      physical_sharing_verified: ${{ inputs.physical_sharing_verified }}
    secrets: inherit

name: Build Android APK (compatibility)

# Keep the previous workflow path available without its obsolete SDK defaults.
# New pushes and pull requests are handled by build.yml.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose the isolated test APK or a signed production release'
        type: choice
        options: [premium-test, release]
        default: premium-test
      publish_release:
        description: 'Publish the verified production APK publicly'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.target != 'release' }}
    uses: ./.github/workflows/build.yml

  release:
    if: ${{ inputs.target == 'release' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish_release: ${{ inputs.publish_release }}
    secrets: inherit
